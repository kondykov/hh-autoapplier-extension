# Деплой backend на домашний сервер по кнопке (#65): Actions → Deploy → Run workflow. Инструкция — docs/DEPLOY.md.
# Репозиторий публичный: здесь только ручной запуск. Другие триггеры (push, pull_request, pull_request_target,
# workflow_run) не добавлять, иначе чужой код сможет попасть на сервер. Логи Actions видны всем.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Что выкатить (ветка, тег или SHA)
        required: true
        default: master
        type: string
      backup:
        description: Бэкап БД перед деплоем
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Выкатить на home-server
    runs-on: [self-hosted, home-server]
    environment: production
    timeout-minutes: 30
    steps:
      # Скрипт берётся из ветки, с которой запущен workflow (Environment пускает только master), а не из выкатываемого
      # коммита: откат работает, даже если в нём скрипт сломан. Сторонний код на сервере — поэтому закреплён по SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Поля формы — только через env: подстановка ${{ }} прямо в run стала бы внедрением команд
      - name: Деплой
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_REF: ${{ inputs.ref }}
          DEPLOY_BACKUP: ${{ inputs.backup }}
        run: bash deploy/deploy.sh
