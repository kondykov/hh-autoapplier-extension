services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hhapplier
      POSTGRES_USER: hhapplier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hhapplier}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hhapplier -d hhapplier"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=hhapplier;Username=hhapplier;Password=${POSTGRES_PASSWORD:-hhapplier}
      Api__Key: ${API_KEY:-}
      Admin__Email: ${ADMIN_EMAIL:-}
      Admin__Password: ${ADMIN_PASSWORD:-}
      Api__KeyUser: ${API_KEY_USER:-}
      Cors__Origins: ${CORS_ORIGINS:-}
      Hh__Enabled: ${HH_ENABLED:-true}
      Collector__IntervalMinutes: ${COLLECT_INTERVAL_MINUTES:-60}
      Llm__ApiKey: ${LLM_API_KEY:-}
      Llm__BaseUrl: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      Llm__Model: ${LLM_MODEL:-openai/gpt-oss-120b}
      Llm__DailyRequestLimit: ${LLM_DAILY_LIMIT:-300}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
