<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ответы работодателей — hh-autoapplier</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #667085; --border: #dfe3ea;
      --accent: #2f6fde; --ok: #1f8a4c; --bad: #c4372f; --warn-bg: #fff6e0; --warn: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171d; --card: #1d2129; --text: #e6e9ef; --muted: #98a2b3; --border: #2e3440;
        --accent: #6b9cf0; --ok: #4cc283; --bad: #f0746c; --warn-bg: #3a2f14; --warn: #f2c66d;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
    input, textarea, button, select { font: inherit; color: inherit; }
    input, textarea, select { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    #status { color: var(--muted); }
    #status.error { color: var(--bad); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card h2 { font-size: 17px; margin: 0; }
    .card h2 a { color: var(--accent); text-decoration: none; }
    .card h2 a:hover { text-decoration: underline; }
    .meta { color: var(--muted); font-size: 14px; margin: 2px 0 10px; }
    .summary { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; font-size: 14px; }
    .msg { white-space: pre-wrap; font-size: 14px; border-left: 3px solid var(--border); padding: 4px 0 4px 10px; margin: 8px 0; }
    .kind { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: 13px; font-weight: 600; margin-right: 6px; border: 1px solid var(--border); }
    .kind.Invitation { background: var(--ok); border-color: var(--ok); color: #fff; }
    .kind.Question { background: var(--accent); border-color: var(--accent); color: #fff; }
    label.field { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    textarea { width: 100%; min-height: 110px; resize: vertical; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .empty { color: var(--muted); text-align: center; padding: 48px 0; }
    .result { align-self: center; font-weight: 600; color: var(--accent); }
    .handled { opacity: .55; }
  </style>
</head>
<body>
<main>
  <h1>Ответы работодателей</h1>
  <p class="sub">Сообщения из чатов hh.ru (#26), их присылает расширение. LLM разбирает приглашения и вопросы и предлагает ответ —
    отправляете вы, в чате hh.ru. Отказы распознаются без LLM; на новые отказы расширение отвечает коротким «спасибо».</p>

  <form id="login" class="bar" hidden>
    <input id="email" type="email" placeholder="Email" autocomplete="username" aria-label="Email" required>
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" aria-label="Пароль" required>
    <button class="primary">Войти</button>
  </form>

  <div id="session" class="bar" hidden>
    <span id="who"></span>
    <select id="filter" aria-label="Какие сообщения показать">
      <option value="open">Необработанные, кроме отказов</option>
      <option value="all">Все</option>
    </select>
    <button id="load" class="primary">Обновить</button>
    <button id="logout">Выйти</button>
  </div>

  <div class="bar"><span id="status" role="status"></span></div>

  <div id="list"></div>
</main>

<script>
  "use strict";
  const loginForm = document.getElementById("login");
  const session = document.getElementById("session");
  const who = document.getElementById("who");
  const list = document.getElementById("list");
  const status = document.getElementById("status");
  const filter = document.getElementById("filter");

  const KINDS = { Invitation: "Приглашение", Question: "Вопрос", Rejection: "Отказ", Other: "Прочее" };
  const AUTO = { Pending: "автоответ ждёт отправки", Sent: "автоответ отправлен", Unavailable: "автоответ невозможен" };

  class Unauthorized extends Error {}

  function setStatus(text, error = false) {
    status.textContent = text;
    status.className = error ? "error" : "";
  }

  async function api(path, options = {}) {
    const res = await fetch(path, { ...options, headers: { "Content-Type": "application/json" } });
    const body = res.status === 204 ? null : await res.json().catch(() => null);
    if (res.status === 401) throw new Unauthorized(body?.message ?? "нужен вход");
    if (res.status === 403) throw new Error(body?.message ?? "нет прав на эти данные");
    if (!res.ok) throw new Error(body?.message ?? `сервер ответил ${res.status}`);
    return body;
  }

  // Сообщения работодателей — только текстом
  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    for (const child of children) if (child != null) node.append(child);
    return node;
  }

  const chatUrl = (m) => `https://hh.ru/chat/${encodeURIComponent(m.chatId)}`;

  function card(m) {
    const reply = el("textarea", { value: m.suggestedReply ?? "", id: `reply-${m.chatId}`,
      placeholder: m.kind == null ? "LLM ещё не разобрала сообщение — обновите страницу через минуту." : "Черновика нет." });
    const copy = el("button", { className: "primary", textContent: "Копировать и открыть чат" });
    const done = el("button", { textContent: "Обработано" });
    const result = el("span", { className: "result" });
    const when = new Date(m.at).toLocaleString("ru-RU", { dateStyle: "medium", timeStyle: "short" });

    const node = el("article", { className: m.handledAt ? "card handled" : "card" },
      el("h2", {}, el("a", { href: chatUrl(m), target: "_blank", rel: "noopener", textContent: m.title || "Чат без вакансии" })),
      el("div", { className: "meta" },
        el("span", { className: `kind ${m.kind ?? "pending"}`, textContent: KINDS[m.kind] ?? "ждёт разбора" }),
        [m.company, when, m.hhState && `hh: ${m.hhState}`, AUTO[m.autoReply], m.autoReplyError, m.handledAt && "обработано"].filter(Boolean).join(" · ")),
      m.summary ? el("div", { className: "summary", textContent: m.summary }) : null,
      el("div", { className: "msg", textContent: m.text }),
      m.kind === "Rejection" ? null : el("label", { className: "field", htmlFor: reply.id,
        textContent: m.llmModel ? `Черновик ответа (${m.llmModel}) — поправьте [заглушки] перед отправкой` : "Черновик ответа" }),
      m.kind === "Rejection" ? null : reply,
      el("div", { className: "actions" }, m.kind === "Rejection" ? null : copy, m.handledAt ? null : done, result));

    // Буфер обмена доступен не везде (http без localhost): тогда текст просто выделяется для Ctrl+C
    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(reply.value);
        result.textContent = "скопировано";
      } catch {
        reply.select();
        result.textContent = "выделено — скопируйте Ctrl+C";
      }
      window.open(chatUrl(m), "_blank", "noopener");
    };

    done.onclick = async () => {
      done.disabled = true;
      try {
        await api(`/api/dialogs/${encodeURIComponent(m.chatId)}/handled`, { method: "POST" });
        node.classList.add("handled");
        done.remove();
        result.textContent = "обработано";
      } catch (e) {
        if (e instanceof Unauthorized) showLogin();
        setStatus(`«${m.title}»: ${e.message}`, true);
        done.disabled = false;
      }
    };
    return node;
  }

  function showLogin() {
    session.hidden = true;
    loginForm.hidden = false;
    document.getElementById("email").focus();
  }

  function showSession(user) {
    loginForm.hidden = true;
    session.hidden = false;
    who.textContent = `Вы: ${user.name ?? user.email}`;
  }

  async function load() {
    setStatus("Загружаю…");
    try {
      const open = filter.value === "open";
      const items = (await api(`/api/dialogs?take=200${open ? "&handled=false" : ""}`))
        .filter((m) => !open || m.kind !== "Rejection");
      if (!items.length) {
        list.replaceChildren(el("p", { className: "empty", textContent: open ? "Новых ответов работодателей нет." : "Сообщений пока нет: нажмите «Автоответ» в панели расширения на странице чатов hh.ru." }));
        setStatus("");
        return;
      }
      list.replaceChildren(...items.map(card));
      setStatus(`Сообщений: ${items.length}`);
    } catch (e) {
      list.replaceChildren();
      if (e instanceof Unauthorized) showLogin();
      setStatus(e.message, true);
    }
  }

  loginForm.onsubmit = async (e) => {
    e.preventDefault();
    const password = document.getElementById("password");
    try {
      const user = await api("/api/auth/login", { method: "POST",
        body: JSON.stringify({ email: document.getElementById("email").value.trim(), password: password.value }) });
      password.value = "";
      showSession(user);
      await load();
    } catch (err) {
      setStatus(err.message, true);
    }
  };

  document.getElementById("logout").onclick = async () => {
    await api("/api/auth/logout", { method: "POST" }).catch(() => null);
    list.replaceChildren();
    setStatus("");
    showLogin();
  };

  document.getElementById("load").onclick = load;
  filter.onchange = load;

  api("/api/auth/me").then((user) => { showSession(user); return load(); }).catch(() => showLogin());
</script>
</body>
</html>
