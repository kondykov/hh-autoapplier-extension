# Исходящий VPN для сервера с российским IP: Groq и Telegram оттуда недоступны, hh.ru должен идти напрямую (#5).
# Через VPN идут только домены из правил xray/base.json, всё остальное — напрямую.
# hh.ru в NO_PROXY: сбор вакансий не зависит от контейнера xray, даже если он упал.
#
# Проще всего из ссылки vless://: python3 xray/vless-to-outbound.py (ввод скрыт, права выставит сам).
# Вручную: скопировать xray/outbound.example.json в xray/outbound.json (не в git), вписать параметры своего сервера,
# тег outbound оставить "vpn"; chown 65532:65532 xray/outbound.json && chmod 600 xray/outbound.json (xray в образе
# работает под uid 65532); в .env добавить COMPOSE_FILE=docker-compose.yml:docker-compose.vpn.yml; docker compose up -d.
services:
  xray:
    # v26.10.31
    image: ghcr.io/xtls/xray-core@sha256:ceabeac03a89d991d2a247361825c1d1d2e9c91cd5dc010f298c7dc0c2f325c9
    restart: unless-stopped
    # Свой каталог: стандартные файлы образа в /usr/local/etc/xray подмешались бы к конфигу
    command: ["run", "-confdir", "/etc/hh-xray"]
    volumes:
      - ./xray/base.json:/etc/hh-xray/00-base.json:ro
      - ./xray/outbound.json:/etc/hh-xray/10-outbound.json:ro

  api:
    environment:
      HTTPS_PROXY: http://xray:10809
      HTTP_PROXY: http://xray:10809
      NO_PROXY: hh.ru,.hh.ru,db,api,xray,localhost,127.0.0.1
